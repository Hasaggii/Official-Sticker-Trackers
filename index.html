<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FWC Stickers">
<meta name="theme-color" content="#0a0e1a">
<title>⚽ FWC Sticker Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --border: #1e293b;
    --accent: #f59e0b;
    --accent2: #10b981;
    --text: #f1f5f9;
    --muted: #64748b;
    --checked: #10b981;
    --checked-bg: #052e16;
    --unchecked: #1e293b;
    --danger: #ef4444;
    --dupe: #6366f1;
    --dupe-bg: #1e1b4b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px 0;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #1a2744 0%, #0f172a 100%);
    padding: 12px 12px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 2px solid var(--accent);
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }

  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 2px;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 7px;
  }

  .stats-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 7px;
  }

  .stat {
    background: var(--border);
    border-radius: 20px;
    padding: 2px 9px;
    font-size: 0.65rem;
    font-weight: 600;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .stat span { color: var(--accent); font-size: 0.75rem; }
  .stat.dupe-stat span { color: var(--dupe); }

  /* ── SEARCH ── */
  .search-bar {
    position: relative;
    margin-bottom: 8px;
  }
  .search-bar input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 10px 8px 30px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    outline: none;
    -webkit-appearance: none;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar .icon {
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 0.8rem;
    pointer-events: none;
  }

  /* ── TABS ── */
  .tab-bar {
    display: flex;
    border-top: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    padding: 9px 0;
    text-align: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.92rem;
    letter-spacing: 1.5px;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    user-select: none;
    touch-action: manipulation;
  }
  .tab.active           { color: var(--accent); border-bottom-color: var(--accent); }
  .tab.dupe-tab.active  { color: var(--dupe);   border-bottom-color: var(--dupe); }

  /* ── PAGES ── */
  .page { display: none; }
  .page.active { display: block; }

  /* ── GROUPS ── */
  .group-container { padding: 0 9px; margin-top: 12px; }

  .group-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 3px;
    margin: 16px 0 5px 3px;
    opacity: 0.7;
  }

  .country-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 11px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .fwc-block {
    background: linear-gradient(135deg, #1a2744, #111827);
    border: 1px solid var(--accent);
    border-radius: 11px;
    margin-bottom: 8px;
    overflow: hidden;
  }

  .country-header, .fwc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 11px;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
  }
  .country-header:active, .fwc-header:active { background: rgba(255,255,255,0.04); }

  .country-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .fwc-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 2px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .country-flag { font-size: 1.05rem; }

  .country-progress {
    font-size: 0.64rem;
    color: var(--muted);
    font-weight: 600;
  }

  .progress-bar { height: 2px; background: var(--border); }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width 0.3s ease;
  }

  .chevron {
    color: var(--muted);
    font-size: 0.7rem;
    transition: transform 0.2s;
    margin-left: 5px;
  }
  .chevron.open { transform: rotate(180deg); }

  /* ── GRIDS ── */
  .stickers-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    padding: 5px 7px 7px;
  }

  /* ── SHARED BUTTON BASE ── */
  .sticker-btn, .dupe-btn {
    aspect-ratio: 1;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.1;
    position: relative;
    overflow: visible;
    padding: 2px;
    touch-action: manipulation;
    min-height: 42px;
    user-select: none;
    -webkit-user-select: none;
    border: 1.5px solid var(--border);
    background: var(--unchecked);
    color: var(--muted);
    transition: transform 0.1s ease, background 0.12s, border-color 0.12s;
  }

  .sticker-btn .btn-prefix,
  .dupe-btn    .btn-prefix { font-size: 0.38rem; opacity: 0.6; letter-spacing: 0.2px; }

  .sticker-btn .btn-num,
  .dupe-btn    .btn-num    { font-size: 0.58rem; font-weight: 800; }

  .sticker-btn:active, .dupe-btn:active { transform: scale(0.88); }

  /* ── COLLECTION: checked state ── */
  .sticker-btn.checked {
    background: var(--checked-bg);
    border-color: var(--checked);
    color: var(--checked);
  }
  .sticker-btn.checked .btn-prefix { opacity: 0.5; }
  .sticker-btn.checked::after {
    content: '✓';
    position: absolute;
    top: 1px; right: 3px;
    font-size: 0.4rem;
    color: var(--checked);
    opacity: 0.8;
  }

  /* ── DUPLICATES: has-dupes state ── */
  .dupe-btn.has-dupes {
    background: var(--dupe-bg);
    border-color: var(--dupe);
    color: #a5b4fc;
  }
  .dupe-btn.has-dupes .btn-prefix { opacity: 0.6; }

  /* long-press ripple */
  .dupe-btn.pressing {
    border-color: var(--danger);
    background: #2d0a0a;
  }

  .dupe-badge {
    position: absolute;
    top: -6px; right: -6px;
    background: var(--dupe);
    color: #fff;
    font-size: 0.46rem;
    font-weight: 900;
    border-radius: 50%;
    width: 13px; height: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    pointer-events: none;
  }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.78);
    z-index: 1000;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s;
  }
  .modal-overlay.active { opacity: 1; pointer-events: all; }

  .modal {
    background: #1a2236;
    border: 1px solid var(--border);
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    padding: 16px 18px 48px;
    width: 100%;
    max-width: 480px;
    transform: translateY(100%);
    transition: transform 0.24s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .modal-overlay.active .modal { transform: translateY(0); }

  .modal-handle {
    width: 38px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 14px;
  }
  .modal h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }
  .modal h3.danger     { color: var(--danger); }
  .modal h3.dupe-color { color: var(--dupe); }
  .modal p {
    font-size: 0.84rem;
    color: var(--muted);
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .modal p strong { color: var(--text); }

  .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

  .btn {
    padding: 13px;
    border-radius: 11px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.86rem;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.12s;
  }
  .btn:active         { transform: scale(0.96); }
  .btn-cancel         { background: var(--border); color: var(--muted); }
  .btn-danger         { background: var(--danger); color: #fff; }
  .btn-dupe           { background: var(--dupe);   color: #fff; }

  /* delete-one / delete-all layout */
  .modal-actions-3 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .modal-actions-3 .btn-full { grid-column: 1 / -1; }

  .hint {
    font-size: 0.65rem;
    color: var(--muted);
    text-align: center;
    margin-top: 5px;
    opacity: 0.7;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>⚽ FWC Stickers</h1>
  <div class="stats-bar" id="stats-bar"></div>
  <div class="search-bar">
    <span class="icon">🔍</span>
    <input type="text" id="search-input" placeholder="Search country…" oninput="filterCountries(this.value)">
  </div>
  <div class="tab-bar">
    <div class="tab active"   id="tab-collection" onclick="switchTab('collection')">📋 Collection</div>
    <div class="tab dupe-tab" id="tab-dupes"      onclick="switchTab('dupes')">🔁 Duplicates</div>
  </div>
</header>

<!-- PAGES -->
<div class="page active" id="page-collection">
  <div class="group-container" id="container-collection"></div>
</div>
<div class="page" id="page-dupes">
  <div class="group-container" id="container-dupes"></div>
</div>

<!-- COLLECTION: undo modal -->
<div class="modal-overlay" id="modal-undo">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 class="danger">Remove Sticker?</h3>
    <p>Uncheck <strong id="undo-card-name"></strong> from your collection?</p>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal('modal-undo')">Cancel</button>
      <button class="btn btn-danger"  onclick="confirmUndo()">Yes, Remove</button>
    </div>
  </div>
</div>

<!-- DUPLICATES: long-press delete modal -->
<div class="modal-overlay" id="modal-dupe-delete">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 class="dupe-color">Remove Duplicate</h3>
    <p>You have <strong id="dd-count"></strong>× <strong id="dd-card-name"></strong>.<br>How many do you want to remove?</p>
    <div class="modal-actions-3">
      <button class="btn btn-dupe"   onclick="confirmDupeRemove(1)">Remove 1</button>
      <button class="btn btn-danger" id="dd-all-btn" onclick="confirmDupeRemoveAll()">Remove All</button>
      <button class="btn btn-cancel btn-full" onclick="closeModal('modal-dupe-delete')">Cancel</button>
    </div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const DATA = {
  "FWC":                { group:"Special",  flag:"🏆",  count:19, prefix:"FWC",  special:true },
  "Mexico":             { group:"Group A",  flag:"🇲🇽", count:20, prefix:"MEX" },
  "South Africa":       { group:"Group A",  flag:"🇿🇦", count:20, prefix:"RSA" },
  "South Korea":        { group:"Group A",  flag:"🇰🇷", count:20, prefix:"KOR" },
  "Czechia":            { group:"Group A",  flag:"🇨🇿", count:20, prefix:"CZE" },
  "Canada":             { group:"Group B",  flag:"🇨🇦", count:20, prefix:"CAN" },
  "Bosnia-Herzegovina": { group:"Group B",  flag:"🇧🇦", count:20, prefix:"BIH" },
  "Qatar":              { group:"Group B",  flag:"🇶🇦", count:20, prefix:"QAT" },
  "Switzerland":        { group:"Group B",  flag:"🇨🇭", count:20, prefix:"SUI" },
  "Brazil":             { group:"Group C",  flag:"🇧🇷", count:20, prefix:"BRA" },
  "Morocco":            { group:"Group C",  flag:"🇲🇦", count:20, prefix:"MAR" },
  "Haiti":              { group:"Group C",  flag:"🇭🇹", count:20, prefix:"HAI" },
  "Scotland":           { group:"Group C",  flag:"🏴󠁧󠁢󠁳󠁣󠁴󠁿", count:20, prefix:"SCO" },
  "USA":                { group:"Group D",  flag:"🇺🇸", count:20, prefix:"USA" },
  "Paraguay":           { group:"Group D",  flag:"🇵🇾", count:20, prefix:"PAR" },
  "Australia":          { group:"Group D",  flag:"🇦🇺", count:20, prefix:"AUS" },
  "Turkey":             { group:"Group D",  flag:"🇹🇷", count:20, prefix:"TUR" },
  "Germany":            { group:"Group E",  flag:"🇩🇪", count:20, prefix:"GER" },
  "Curaçao":            { group:"Group E",  flag:"🇨🇼", count:20, prefix:"CUW" },
  "Côte d'Ivoire":      { group:"Group E",  flag:"🇨🇮", count:20, prefix:"CIV" },
  "Ecuador":            { group:"Group E",  flag:"🇪🇨", count:20, prefix:"ECU" },
  "Netherlands":        { group:"Group F",  flag:"🇳🇱", count:20, prefix:"NED" },
  "Japan":              { group:"Group F",  flag:"🇯🇵", count:20, prefix:"JPN" },
  "Sweden":             { group:"Group F",  flag:"🇸🇪", count:20, prefix:"SWE" },
  "Tunisia":            { group:"Group F",  flag:"🇹🇳", count:20, prefix:"TUN" },
  "Belgium":            { group:"Group G",  flag:"🇧🇪", count:20, prefix:"BEL" },
  "Egypt":              { group:"Group G",  flag:"🇪🇬", count:20, prefix:"EGV" },
  "IR Iran":            { group:"Group G",  flag:"🇮🇷", count:20, prefix:"IRN" },
  "New Zealand":        { group:"Group G",  flag:"🇳🇿", count:20, prefix:"NZL" },
  "Spain":              { group:"Group H",  flag:"🇪🇸", count:20, prefix:"ESP" },
  "Cabo Verde":         { group:"Group H",  flag:"🇨🇻", count:20, prefix:"CPV" },
  "Saudi Arabia":       { group:"Group H",  flag:"🇸🇦", count:20, prefix:"KSA" },
  "Uruguay":            { group:"Group H",  flag:"🇺🇾", count:20, prefix:"URU" },
  "France":             { group:"Group I",  flag:"🇫🇷", count:20, prefix:"FRA" },
  "Senegal":            { group:"Group I",  flag:"🇸🇳", count:20, prefix:"SEN" },
  "Iraq":               { group:"Group I",  flag:"🇮🇶", count:20, prefix:"IRQ" },
  "Norway":             { group:"Group I",  flag:"🇳🇴", count:20, prefix:"NOR" },
  "Argentina":          { group:"Group J",  flag:"🇦🇷", count:20, prefix:"ARG" },
  "Algeria":            { group:"Group J",  flag:"🇩🇿", count:20, prefix:"ALG" },
  "Austria":            { group:"Group J",  flag:"🇦🇹", count:20, prefix:"AUT" },
  "Jordan":             { group:"Group J",  flag:"🇯🇴", count:20, prefix:"JOR" },
  "Portugal":           { group:"Group K",  flag:"🇵🇹", count:20, prefix:"POR" },
  "Congo DR":           { group:"Group K",  flag:"🇨🇩", count:20, prefix:"COD" },
  "Uzbekistan":         { group:"Group K",  flag:"🇺🇿", count:20, prefix:"UZB" },
  "Colombia":           { group:"Group K",  flag:"🇨🇴", count:20, prefix:"COL" },
  "England":            { group:"Group L",  flag:"🏴󠁧󠁢󠁥󠁮󠁧󠁿", count:20, prefix:"ENG" },
  "Croatia":            { group:"Group L",  flag:"🇭🇷", count:20, prefix:"CRO" },
  "Ghana":              { group:"Group L",  flag:"🇬🇭", count:20, prefix:"GHA" },
  "Panama":             { group:"Group L",  flag:"🇵🇦", count:20, prefix:"PAN" },
};

// ── STATE ─────────────────────────────────────────────────────────────────────
let collection = JSON.parse(localStorage.getItem('fwc-collection') || '{}');
let dupes      = JSON.parse(localStorage.getItem('fwc-dupes')      || '{}');

function save() {
  localStorage.setItem('fwc-collection', JSON.stringify(collection));
  localStorage.setItem('fwc-dupes',      JSON.stringify(dupes));
}

// ── TABS ──────────────────────────────────────────────────────────────────────
let currentTab = 'collection';
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('page-collection').classList.toggle('active', tab === 'collection');
  document.getElementById('page-dupes').classList.toggle('active', tab === 'dupes');
  document.getElementById('tab-collection').classList.toggle('active', tab === 'collection');
  document.getElementById('tab-dupes').classList.toggle('active', tab === 'dupes');
  updateStats();
  filterCountries(document.getElementById('search-input').value);
}

// ── COLLECTION ────────────────────────────────────────────────────────────────
let pendingUndo = null;

function tapCollectionBtn(id, countryName) {
  if (collection[id]) {
    pendingUndo = { id, countryName };
    document.getElementById('undo-card-name').textContent = id;
    openModal('modal-undo');
  } else {
    collection[id] = true;
    save();
    refreshCollectionBtn(id);
    updateProgress('col', countryName);
    updateStats();
  }
}

function confirmUndo() {
  if (!pendingUndo) return;
  const { id, countryName } = pendingUndo;
  delete collection[id];
  save();
  refreshCollectionBtn(id);
  updateProgress('col', countryName);
  updateStats();
  pendingUndo = null;
  closeModal('modal-undo');
}

function refreshCollectionBtn(id) {
  const btn = document.getElementById('col-' + id);
  if (!btn) return;
  btn.classList.toggle('checked', !!collection[id]);
}

// ── DUPLICATES ────────────────────────────────────────────────────────────────
// TAP  → always adds 1
// HOLD → opens delete modal (remove 1 or remove all)

let pendingDupeDelete = null;
let longPressTimer    = null;
const LONG_PRESS_MS   = 500;

function dupePointerDown(e, id, countryName) {
  // Prevent default to avoid ghost click and context menu on mobile
  e.preventDefault();
  const btn = document.getElementById('dupe-' + id);
  if (btn) btn.classList.add('pressing');

  longPressTimer = setTimeout(() => {
    longPressTimer = null;
    if (btn) btn.classList.remove('pressing');
    const count = dupes[id] || 0;
    if (count === 0) return; // nothing to delete
    pendingDupeDelete = { id, countryName };
    document.getElementById('dd-card-name').textContent = id;
    document.getElementById('dd-count').textContent = count;
    document.getElementById('dd-all-btn').textContent = `Remove All (${count})`;
    openModal('modal-dupe-delete');
  }, LONG_PRESS_MS);
}

function dupePointerUp(e, id, countryName) {
  const btn = document.getElementById('dupe-' + id);
  if (btn) btn.classList.remove('pressing');

  if (longPressTimer !== null) {
    // Short tap — add one duplicate
    clearTimeout(longPressTimer);
    longPressTimer = null;
    dupes[id] = (dupes[id] || 0) + 1;
    save();
    refreshDupeBtn(id);
    updateProgress('dup', countryName);
    updateStats();
  }
}

function dupePointerCancel(id) {
  const btn = document.getElementById('dupe-' + id);
  if (btn) btn.classList.remove('pressing');
  if (longPressTimer !== null) {
    clearTimeout(longPressTimer);
    longPressTimer = null;
  }
}

function confirmDupeRemove(n) {
  if (!pendingDupeDelete) return;
  const { id, countryName } = pendingDupeDelete;
  dupes[id] = Math.max(0, (dupes[id] || 0) - n);
  if (dupes[id] === 0) delete dupes[id];
  save();
  refreshDupeBtn(id);
  updateProgress('dup', countryName);
  updateStats();
  pendingDupeDelete = null;
  closeModal('modal-dupe-delete');
}

function confirmDupeRemoveAll() {
  if (!pendingDupeDelete) return;
  const { id, countryName } = pendingDupeDelete;
  delete dupes[id];
  save();
  refreshDupeBtn(id);
  updateProgress('dup', countryName);
  updateStats();
  pendingDupeDelete = null;
  closeModal('modal-dupe-delete');
}

function refreshDupeBtn(id) {
  const btn = document.getElementById('dupe-' + id);
  if (!btn) return;
  const count = dupes[id] || 0;
  btn.classList.toggle('has-dupes', count > 0);
  let badge = btn.querySelector('.dupe-badge');
  if (count > 0) {
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'dupe-badge';
      btn.appendChild(badge);
    }
    badge.textContent = count;
  } else {
    if (badge) badge.remove();
  }
}

// ── PROGRESS ──────────────────────────────────────────────────────────────────
function updateProgress(mode, countryName) {
  const info = DATA[countryName];
  if (!info) return;
  const sk = countryName.replace(/[^a-zA-Z0-9]/g, '_');
  let count = 0;
  for (let i = 1; i <= info.count; i++) {
    const id = info.prefix + ' ' + i;
    if (mode === 'col' && collection[id]) count++;
    if (mode === 'dup' && (dupes[id] || 0) > 0) count++;
  }
  const pct = Math.round((count / info.count) * 100);
  const fill  = document.getElementById(mode + '-fill-'  + sk);
  const label = document.getElementById(mode + '-label-' + sk);
  if (fill)  fill.style.width  = pct + '%';
  if (label) label.textContent = count + '/' + info.count;
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function updateStats() {
  let colChecked = 0, colTotal = 0, dupeCards = 0, dupeTotal = 0;
  for (const [, info] of Object.entries(DATA)) {
    for (let i = 1; i <= info.count; i++) {
      const id = info.prefix + ' ' + i;
      colTotal++;
      if (collection[id]) colChecked++;
      const d = dupes[id] || 0;
      if (d > 0) { dupeCards++; dupeTotal += d; }
    }
  }
  const bar = document.getElementById('stats-bar');
  if (currentTab === 'collection') {
    bar.innerHTML = `
      <div class="stat">Have: <span>${colChecked}</span></div>
      <div class="stat">Total: <span>${colTotal}</span></div>
      <div class="stat">Missing: <span>${colTotal - colChecked}</span></div>`;
  } else {
    bar.innerHTML = `
      <div class="stat dupe-stat">Unique dupes: <span>${dupeCards}</span></div>
      <div class="stat dupe-stat">Total copies: <span>${dupeTotal}</span></div>
      <p style="font-size:0.6rem;color:var(--muted);margin-top:2px;margin-bottom:-2px">Tap to add · Hold to remove</p>`;
  }
}

// ── MODALS ────────────────────────────────────────────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('active'); }
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
  if (id === 'modal-undo')        pendingUndo        = null;
  if (id === 'modal-dupe-delete') pendingDupeDelete  = null;
}
['modal-undo','modal-dupe-delete'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal(id);
  });
});

// ── BUILD UI ──────────────────────────────────────────────────────────────────
function buildGroups(containerId, mode) {
  const container = document.getElementById(containerId);
  const groups = {};
  for (const [name, info] of Object.entries(DATA)) {
    if (!groups[info.group]) groups[info.group] = [];
    groups[info.group].push({ name, ...info });
  }

  for (const [group, countries] of Object.entries(groups)) {
    const gl = document.createElement('div');
    gl.className = 'group-label';
    gl.dataset.groupMode = mode;
    gl.textContent = group.toUpperCase();
    container.appendChild(gl);

    for (const country of countries) {
      const sk      = country.name.replace(/[^a-zA-Z0-9]/g, '_');
      const gridId  = mode + '-grid-' + sk;
      const chevId  = mode + '-chev-' + sk;
      const hClass  = country.special ? 'fwc-header'  : 'country-header';
      const nClass  = country.special ? 'fwc-name'    : 'country-name';

      let countActive = 0;
      for (let i = 1; i <= country.count; i++) {
        const id = country.prefix + ' ' + i;
        if (mode === 'col' && collection[id]) countActive++;
        if (mode === 'dup' && (dupes[id]||0) > 0) countActive++;
      }
      const pct = Math.round((countActive / country.count) * 100);

      // Build button HTML
      const buttons = Array.from({ length: country.count }, (_, i) => {
        const num = i + 1;
        const id  = country.prefix + ' ' + num;

        if (mode === 'col') {
          const cls = collection[id] ? 'checked' : '';
          return `<button class="sticker-btn ${cls}" id="col-${id}"
            onclick="tapCollectionBtn('${id}','${country.name}')">
            <span class="btn-prefix">${country.prefix}</span>
            <span class="btn-num">${num}</span>
          </button>`;
        } else {
          const cnt   = dupes[id] || 0;
          const cls   = cnt > 0 ? 'has-dupes' : '';
          const badge = cnt > 0 ? `<span class="dupe-badge">${cnt}</span>` : '';
          // Use pointer events for reliable long-press on mobile
          return `<button class="dupe-btn ${cls}" id="dupe-${id}"
            onpointerdown="dupePointerDown(event,'${id}','${country.name}')"
            onpointerup="dupePointerUp(event,'${id}','${country.name}')"
            onpointercancel="dupePointerCancel('${id}')"
            onpointerleave="dupePointerCancel('${id}')">
            <span class="btn-prefix">${country.prefix}</span>
            <span class="btn-num">${num}</span>${badge}
          </button>`;
        }
      }).join('');

      const block = document.createElement('div');
      block.className = country.special ? 'fwc-block' : 'country-block';
      block.id = mode + '-block-' + sk;
      block.dataset.country = country.name.toLowerCase();
      block.dataset.mode = mode;
      block.innerHTML = `
        <div class="${hClass}" onclick="toggleBlock('${gridId}','${chevId}')">
          <div class="${nClass}">
            <span class="country-flag">${country.flag}</span>${country.name}
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="country-progress" id="${mode}-label-${sk}">${countActive}/${country.count}</span>
            <span class="chevron" id="${chevId}">▼</span>
          </div>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="${mode}-fill-${sk}" style="width:${pct}%"></div>
        </div>
        <div class="stickers-grid hidden" id="${gridId}">${buttons}</div>`;

      container.appendChild(block);
    }
  }
}

function toggleBlock(gridId, chevId) {
  document.getElementById(gridId).classList.toggle('hidden');
  document.getElementById(chevId).classList.toggle('open');
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
function filterCountries(query) {
  const q    = query.toLowerCase().trim();
  const mode = currentTab === 'collection' ? 'col' : 'dup';
  document.querySelectorAll('.country-block,.fwc-block').forEach(b => {
    if (b.dataset.mode !== mode) return;
    b.style.display = (!q || b.dataset.country.includes(q)) ? '' : 'none';
  });
  document.querySelectorAll('.group-label').forEach(l => {
    if (l.dataset.groupMode !== mode) return;
    let next = l.nextElementSibling, any = false;
    while (next && !next.classList.contains('group-label')) {
      if (next.dataset.mode === mode && next.style.display !== 'none') any = true;
      next = next.nextElementSibling;
    }
    l.style.display = any ? '' : 'none';
  });
}

// Prevent context menu on long-press (iOS/Android)
document.addEventListener('contextmenu', e => e.preventDefault());

// ── INIT ──────────────────────────────────────────────────────────────────────
buildGroups('container-collection', 'col');
buildGroups('container-dupes',      'dup');
updateStats();
</script>
</body>
</html>
